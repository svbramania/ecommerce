query ProductDetail($slug: String!, $channel: String!) {
  product(slug: $slug, channel: $channel) {
    id
    name
    description
    thumbnail {
      url
      alt
    }
    bundleComponents: metafield(key: "bundle_components")
    variants {
      id
      name
      quantityAvailable
      pricing {
        price {
          gross {
            amount
            currency
          }
        }
      }
    }
  }
}
