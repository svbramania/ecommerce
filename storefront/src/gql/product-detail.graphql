query ProductDetail($slug: String!, $channel: String!) {
  product(slug: $slug, channel: $channel) {
    id
    name
    description
    rating
    created
    weight {
      value
      unit
    }
    category {
      id
      name
      slug
    }
    thumbnail {
      url
      alt
    }
    media {
      id
      url
      alt
      sortOrder
      type
    }
    reviewsMetadata: metafield(key: "reviews")
    bundleComponents: metafield(key: "bundle_components")
    assignedAttributes {
      attribute {
        name
        visibleInStorefront
      }
      __typename
      ... on AssignedPlainTextAttribute {
        plainTextValue: value
      }
      ... on AssignedTextAttribute {
        richTextValue: value
      }
      ... on AssignedSingleChoiceAttribute {
        choiceValue: value {
          name
        }
      }
      ... on AssignedMultiChoiceAttribute {
        multiChoiceValue: value {
          name
        }
      }
      ... on AssignedNumericAttribute {
        numericValue: value
      }
      ... on AssignedBooleanAttribute {
        booleanValue: value
      }
    }
    variants {
      id
      name
      sku
      weight {
        value
        unit
      }
      quantityAvailable
      pricing {
        price {
          gross {
            amount
            currency
          }
        }
      }
    }
  }
}
